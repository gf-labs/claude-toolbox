# Tooling config only — claude-toolbox is NOT an installable package: there is
# no [build-system] and [project] carries no `version`, so `pip install .` and
# `pip install -e '.[dev]'` both fail (see scripts/stamp-git-policy.py's
# derive_install, which encodes that lesson). The lint/test pins live in
# requirements-dev.txt, the single source shared by test.yml and release.yml.

[project]
name = "claude-toolbox"
description = "Session lifecycle management for Claude Code"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — handled by line-length when needed
    "B904",  # raise-from — inappropriate in hook/degradation contexts
]

[tool.pytest.ini_options]
testpaths = ["tests"]
