name: test

# Lint + test gate, plus a manifest<->tag drift guard on main. Runs on PRs into
# main AND develop, and on pushes to develop/main.
# The repo is ruff-clean; `ruff check .` runs before pytest and fails the gate
# on any lint regression (config in pyproject.toml [tool.ruff]).
#
# develop is in the PR list because integration is where regressions are cheap
# to catch: gating only main meant feature PRs merged into develop unchecked,
# and the first CI signal arrived at the release PR.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Least privilege: these jobs only read the checked-out tree.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # The suite is deliberately stdlib-only (scripts loaded by path via
      # importlib); pyproject is tooling config, not an installable package —
      # so the toolchain comes from requirements-dev.txt rather than an extra.
      # That file is the single source of the pins, shared with release.yml.
      - name: Install pytest + ruff
        run: python3 -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python3 -m pytest tests/ -q

# The manifest<->tag guard that used to live here moved to release-gate.yml.
# It was push-to-main-only, so it could never be a required check (a skipped job
# reports nothing, and a required check that never reports blocks the PR); it
# also used the reachability-blind default mode, which passes on a squash-orphaned
# tag. release-gate.yml splits the assertion by event and uses --nearest.
